[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wharagbot"
version = "0.1.0"
description = "RAG sobre exportes de WhatsApp para responder como Wenceslao."
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
wharagbot = "wharagbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
